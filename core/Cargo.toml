[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lib]
name = "vault_core"
path = "src/lib.rs"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
blake3 = "1.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
